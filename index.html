<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f3ed" />
    <meta name="description" content="תוכניות אימון כדורגל אישיות לפי עמדה, רמה ומטרת אימון." />
    <title>PLAYFORM | אימונים לשחקני כדורגל</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      /* Show the Google Translate language selector as a compact app control. */
      #google_translate_element{position:fixed;top:12px;left:14px;z-index:1000;background:linear-gradient(135deg,#174a36 0%,#36a269 55%,#b5ee65 100%);border:1px solid #2f8653;border-radius:8px;padding:5px 10px;box-shadow:0 3px 12px #174a3640}
      #google_translate_element:before{content:'Change language';display:inline-block;margin-right:8px;color:#fff;font:700 12px 'Heebo',sans-serif;vertical-align:middle}
      #google_translate_element select{max-width:180px;height:30px;border:1px solid #ffffff80;border-radius:5px;background:#ffffffed;color:#173b2b;font:600 12px 'Heebo',sans-serif;cursor:pointer;vertical-align:middle}
      .goog-te-gadget{font:0 'Heebo',sans-serif!important;color:transparent!important}
      .goog-te-gadget .goog-te-combo{margin:0!important}
      .goog-te-gadget span,.goog-logo-link,.goog-te-banner-frame{display:none!important}
      body{top:0!important}
      /* The sidebar pitch should be a landscape field (length > width). */
      .pitch{height:92px!important}
      @media(max-width:850px){#google_translate_element{top:8px;left:8px;padding:4px 6px}#google_translate_element:before{font-size:10px;margin-right:5px}#google_translate_element select{max-width:135px;height:27px;font-size:10px}}
    </style>
  </head>
  <body>
    <div id="google_translate_element" aria-label="Change language"></div>
    <div id="root"></div>
    <script>
      function googleTranslateElementInit(){
        new google.translate.TranslateElement({pageLanguage:'he',autoDisplay:false},'google_translate_element');
      }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
