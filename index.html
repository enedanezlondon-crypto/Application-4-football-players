<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f3ed" />
    <meta name="description" content="תוכניות אימון כדורגל אישיות לפי עמדה, רמה ומטרת אימון." />
    <title>PLAYFORM | אימונים לשחקני כדורגל</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      /* Show the Google Translate language selector as a compact app control. */
      #google_translate_element{position:fixed;top:12px;left:14px;z-index:1000;background:#fbfcf8;border:1px solid #dfe3d9;border-radius:4px;padding:4px 8px;box-shadow:0 2px 10px #1b282114}
      #google_translate_element select{max-width:180px;height:30px;border:0;background:transparent;color:#1b2821;font:12px 'Heebo',sans-serif;cursor:pointer}
      .goog-te-gadget{font:0 'Heebo',sans-serif!important;color:transparent!important}
      .goog-te-gadget .goog-te-combo{margin:0!important}
      .goog-te-gadget span,.goog-logo-link,.goog-te-banner-frame{display:none!important}
      body{top:0!important}
      /* The sidebar pitch should be a landscape field (length > width). */
      .pitch{height:92px!important}
      @media(max-width:850px){#google_translate_element{top:8px;left:8px;padding:2px 5px}#google_translate_element select{max-width:135px;height:27px;font-size:11px}}
    </style>
  </head>
  <body>
    <div id="google_translate_element" aria-label="בחירת שפה"></div>
    <div id="root"></div>
    <script>
      function googleTranslateElementInit(){
        new google.translate.TranslateElement({pageLanguage:'he',autoDisplay:false},'google_translate_element');
      }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
